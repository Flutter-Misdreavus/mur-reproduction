<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
  <title id="title">MUR — Independent paper reproduction</title>
  <desc id="desc">Momentum Uncertainty guided Reasoning. Selective search with traceable evidence. A conceptual diagram shows an uncertainty gate routing a proposal through four candidates before accepting a step.</desc>
